<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bokning</title>
    <style>
        body {display: flex; justify-content: center; align-items: center; background-color: #091413; margin-top: 50px;}
        h1 {color: #B0E4CC;}
    </style>
</head>
<body>
    <div style="display:flex; flex-direction: column; align-items: center; background-color: #408A71; width: 300px; border: 15px solid #285A48; border-radius: 5px">
        <h1>Bokning av rum</h1>

        <div style="display:flex; flex-direction: column; align-items: center;">
            <input id="roomId" placeholder="Rum id">
            <input id="startTime" type="datetime-local">
            <input id="endTime" type="datetime-local">
            <button onClick="bookingRoom()">Boka rum</button>
        </div>

        <ul style="margin-bottom: 10px; color: #B0E4CC;" id="userBookings"></ul>

        <div style="margin-bottom: 10px; color: #B0E4CC;" id="notefickation"></div>
    </div>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        const socket = io();
        socket.emit('message', 'Hej och välkommen');
        const feadback = document.getElementById('notefickation');
        socket.on('serverMessage', (data) => {
                feadback.innerText = data;
            });
        socket.on('bookingCreated', (data) => {
            fetchBookings();
            const roomName = data.message.roomId.name;
            feadback.innerText = `Bokning har skappats: ${roomName}`;
        });
        socket.on('bookingDeleted', (data) => {
            fetchBookings();
            feadback.innerText = data.message;
        });

        async function bookingRoom() {
            const roomId = document.getElementById('roomId').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const savedToken = localStorage.getItem('token');

            feadback.innerText= 'Bokning skickad....';
            const bookingRom = await fetch ('/bookings', {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json',
                    'Authorization' : `Bearer ${savedToken}`
                },
                body: JSON.stringify({roomId, startTime, endTime})
            });

            const data = await bookingRom.json();

        }

        async function fetchBookings() {
            const savedToken = localStorage.getItem('token');
            const listOfBooking = document.getElementById('userBookings');
            listOfBooking.innerHTML = '';

            const gottBooking = await fetch ('/bookings', {
                method: 'GET',
                headers: {
                    'Authorization' : `Bearer ${savedToken}`
                },
            });

            const data = await gottBooking.json();
            console.log(data);

            if(!gottBooking.ok) {
                throw new Error(data.message);
            }

            data.forEach(bokings => {
                const li = document.createElement('li');
                li.innerText = `${bokings.roomId.name || bokings.romId._id} = ${bokings.startTime} - ${bokings.endTime}`;
                const deliteButton = document.createElement('button');
                deliteButton.innerText = 'Avboka';
            
                deliteButton.addEventListener('click', () => {
                    deleteOfBooking(bokings._id);
                })

                li.appendChild(deliteButton);
                listOfBooking.appendChild(li);
            });

        }
        fetchBookings();

        async function deleteOfBooking(bookingId) {
            const savedToken = localStorage.getItem('token');

            feadback.innerText ='Radering påbörjad ...';
            const deleteBooking = await fetch(`/bookings/${bookingId}`,{
                method: 'DELETE',
                headers: {
                    'Content-type': 'application/json',
                    'Authorization' : `Bearer ${savedToken}`
                },
            })
        }
    </script>
</body>
</html>
