<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Bokning av rum</h1>

    <div>
        <input id="roomId" placeholder="Rum id">
        <input id="startTime" type="datetime-local">
        <input id="endTime" type="datetime-local">
        <button onClick="bookingRoom()">Boka rum</button>
    </div>

    <ul id="userBookings"></ul>

    <div id="notefickation"></div>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
        const socket = io();
        socket.emit('message', 'Socket startar. Hej');
        const feadback = document.getElementById('notefickation');
        socket.on('chatMesa', (data) => {
                feadback.innerText = data.message;
            });

        async function bookingRoom() {
            const roomId = document.getElementById('roomId').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            const savedToken = localStorage.getItem('token');

            feadback.innerText= 'Bokning skickad....';
            const bookingRom = await fetch ('/bookings', {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json',
                    'Authorization' : `Bearer ${savedToken}`
                },
                body: JSON.stringify({roomId, startTime, endTime})
            });

            const data = await bookingRom.json();

            if(bookingRom.ok) {
                feadback.innerText= `Bokning har skappats: ${data}`;
            } else {
                feadback.innerText= `Bokningen kunde ej genomföras`;
            }
        }

        async function fetchBookings() {
            const savedToken = localStorage.getItem('token');
            const listOfBooking = document.getElementById('userBookings');

            feadback.innerText= 'Data hämtas....';
            const gottBooking = await fetch ('/bookings', {
                method: 'GET',
                headers: {
                    'Authorization' : `Bearer ${savedToken}`
                },
            });

            const data = await gottBooking.json();

            if(!gottBooking.ok) {
                throw new Error(data.message);
            }

            data.forEach(bokings => {
                const li = document.createElement('li');
                li.innerText = `${bokings.roomId} = ${bokings.startTime} - ${bokings.endTime}`;
                const deliteButton = document.createElement('button');
                deliteButton.innerText = 'Avboka';
            
                deliteButton.addEventListener('click', () => {
                    deleteOfBooking(bokings._id);
                })

                li.appendChild(deliteButton);
                listOfBooking.appendChild(li);
                
            });

            feadback.innerText = '';
        }
        fetchBookings();

        async function deleteOfBooking(bookingId) {
            const savedToken = localStorage.getItem('token');

            feadback.innerText ='Radering påbörjad ...';
            const deleteBooking = await fetch(`/bookings/${bookingId}`,{
                method: 'DELETE',
                headers: {
                    'Content-type': 'application/json',
                    'Authorization' : `Bearer ${savedToken}`
                },
            })
            feadback.innerText = 'Booking har tagits bort'
        }
    </script>
</body>
</html>
